name: Other bug
description: Something in audit, serve or the CLI does not work.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: What you ran
      description: Commands, flags and input. Leave out real webhook URLs, ntfy topics and hostnames.
      render: text
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cronplain version and OS
      placeholder: "cronplain version output; macOS 15 / Ubuntu 24.04"
